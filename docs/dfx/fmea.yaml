# ===================== 前端编译器 =====================
 - 触发条件: 开发者使用错误语法的代码进行编译
  故障模式: 编译器UNREACHABLE报错
  故障影响: 影响开发者，编译失败，无法编译出abc文件
  故障原因: 开发者代码使用语法错误，编译器无法识别，没有报语法错误
  严酷度: 一般
  恢复措施: 针对开发者有问题语法代码进行报错处理，并扩展UT场景看护

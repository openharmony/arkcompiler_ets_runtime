# ===================== GC =====================
 - 触发条件: OOM场景下触发GC
  故障模式: GC频繁
  故障影响: 导致freeze或功耗问题
  故障原因: 应用本身存在内存泄漏，OOM前频繁GC导致高负载发热
  严酷度: 一般
  恢复措施: 1. 虚拟机配合提供规避方案（限制GC频率），兜底内存泄漏高负载问题；2. 抖音、微信视频等典型应用场景的GC策略持续优化；3. 联合GC耗时较长的打点及当前应用场景、前后台状态等，提前识别GC对实际应用的影响
  关键日志: NA
  大数据打点事件: 不涉及

 - 触发条件: GC扫描过程中遇到非法对象
  故障模式: GC扫描到非法对象
  故障影响: 应用发生cppcrash
  故障原因: 应用存在多线程安全问题或者非法使用js对象的问题(多全局缓存napi_value，使用已经出scope的napi_value等)
  严酷度: 一般
  恢复措施: 1. 实验室默认开启多线程安全检测；2. 提供非法使用napi_value的检测patch，因性能问题暂未上库
  关键日志: NA
  大数据打点事件: 不涉及

 - 触发条件: 性能敏感场景下触发GC
  故障模式: GC耗时长
  故障影响: 性能敏感场景导致应用卡顿丢帧
  故障原因: GC时需要暂停工作线程，对象root级标记及对象搬移阶段耗时长
  严酷度: 一般
  恢复措施: 敏感场景提高GC水线，尽量不触发GC
  关键日志: NA
  大数据打点事件: ARK_GC_LONG_TIME

# ===================== 运行时 =====================
 - 触发条件: 应用侧调用Object.assign接口
  故障模式: Object.assign返回错误结果
  故障影响: 应用侧调用Object.assign接口时，无法返回正确结果，阻塞应用需求开发，同时也影响应用现网版本
  故障原因: 解释器关于对应builtin接口在特殊场景下的实现逻辑错误，存入非法key值
  严酷度: 一般
  恢复措施: 1. 解释器在6.1/7.0版本时，可基于非兼容变更流程修复问题；2. 提供大数据打点事件，看护现网版本是否受影响
  关键日志: NA
  大数据打点事件: OBJECT_ASSIGN（暂定）

 - 触发条件: 应用侧对存在Proxy的数组调用flatMap接口
  故障模式: flatMap对于存在proxy的数组的拍平场景返回值错误
  故障影响: 影响flatMap接口功能
  故障原因: 解释器对于builtins接口（Array.prototype.flatMap）在存在代理数组的Proxy数组中实现逻辑错误，未将代理数组的Proxy拍平
  严酷度: 一般
  恢复措施: 1. 解释器在6.1/7.0版本时，可基于非兼容变更流程修复问题；2. 提供大数据打点事件，看护现网版本是否受影响
  关键日志: NA
  大数据打点事件: 不涉及


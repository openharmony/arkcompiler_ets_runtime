# ===================== NAPI =====================
 - 触发条件: 应用调用napi_unwrap/napi_get_value_external接口
  故障模式: 部分接口存在类型混淆的安全漏洞
  故障影响: napi_unwrap/napi_get_value_external设计时未考虑安全，导致其全部使用者具有类型混淆问题
  故障原因: napi_unwrap/napi_get_value_external接口获取出来的对象是void*类型，不是具体的类型存在类型混淆破坏内存的问题
  严酷度: 一般
  恢复措施: 提供校验类型的安全接口
  关键日志: NA
  大数据打点事件: 不涉及

 - 触发条件: 应用调用napi_create_string_utf8接口
  故障模式: napi_create_string_utf8对入参str是否为utf8没有做有效性的校验
  故障影响: napi_get_value_string_utf8拿到的string和初始的string不一致，后续可能会有crash的影响
  故障原因: 运行时内部的编码方式是utf16，在对字符串转换时没做check，导致napi_get_value_string_utf8拿到的string和初始的string不一致
  严酷度: 一般
  恢复措施: 短期开发者自行确保入参的合法性；长期来看虚拟机底层做拦截
  关键日志: NA
  大数据打点事件: 不涉及

 - 触发条件: 应用调用napi_define_properties接口注册属性
  故障模式: napi_define_properties接口注册属性失败没有日志信息，定位困难
  故障影响: 影响后续功能，访问属性抛异常
  故障原因: 开发者创建的对象不可配置属性，没有定位日志来提示开发者
  严酷度: 一般
  恢复措施: 规划DFX增强的需求
  关键日志: NA
  大数据打点事件: 不涉及

# ===================== 并发 =====================
 - 触发条件: 应用使用worker执行task任务
  故障模式: worker无法使用
  故障影响: 有空闲worker但是无法调度去执行task任务，导致少量task的情况下长时间无法被调度到
  故障原因: worker中创建loop没有被完全析构掉
  严酷度: 一般
  恢复措施: 需要应用方排查是否有哪里使用的代码或导入的包有问题
  关键日志: NA
  大数据打点事件: ARK_FFRT_UV

 - 触发条件: 应用通过uv_async_send接口添加任务
  故障模式: 任务不执行
  故障影响: 任务只有添加进来，但是没有执行操作
  故障原因: uv_async_send接口执行失败
  严酷度: 一般
  恢复措施: 需要uv参与排查
  关键日志: NA
  大数据打点事件: 不涉及

# ===================== 动态基础库 =====================
 - 触发条件: 应用使用URL库进行查询参数解析
  故障模式: URL库解析错误
  故障影响: url修改查询参数后%20变为+
  故障原因: 由于编码格式的区别，查询时将字符串%20解码为空格，application/x-www-form-urlencoded将空格（以及%20）转换为+
  严酷度: 一般
  恢复措施: 进行set的自定义编码
  关键日志: NA
  大数据打点事件: 不涉及

# ===================== 调试调优 =====================
 - 触发条件: 开发者使用调试功能对ArkTS代码进行调试
  故障模式: 调试态下应用运行卡顿
  故障影响: 调试态下应用运行可能在部分场景卡顿丢帧
  故障原因: 1. BytecodePcChange / HandleStep等高频接口增加耗时操作；2. 调试文件加载缓存失效
  严酷度: 一般
  恢复措施: 1. 涉及高频调用接口修改严格审视；2. 代码上库前需执行调试调优端到端性能测试用例集合，防止引入性能问题
  关键日志: NA
  大数据打点事件: 不涉及

 - 触发条件: 开发者通过IDE连接调试器
  故障模式: 调试器启动与IDE连接失败
  故障影响: 开发者通过IDE连接调试器失败，调试功能无法使用
  故障原因: Jswp线程没有在fd pair生成后调用调试器接口建立wsSocket连接
  严酷度: 一般
  恢复措施: 重启调试概率恢复
  关键日志: NA
  大数据打点事件: 不涉及

 - 触发条件: 开发者在调试时设置断点
  故障模式: 调试断点设置失败
  故障影响: 特定断点无法在调试时设置
  故障原因: 当前调试器从IDE侧断点设置消息中获取的断点信息不是有效断点位置
  严酷度: 一般
  恢复措施: 1. UT已上架看护相关场景；2. 调试端到端测试用例已集成上架断点设置相关用例看护断点设置场景
  关键日志: NA
  大数据打点事件: 不涉及

 - 触发条件: 开发者在调试时查看闭包变量
  故障模式: 调试闭包变量展示异常
  故障影响: 调试时闭包变量展示异常，同名且具体值错乱
  故障原因: 前端编译器在Debug模式下编译生成的abc文件中，对于创建闭包字节码的入参处理有误
  严酷度: 一般
  恢复措施: 1. 前端字节码verifier看护字节码正确性；2. 调试端到端测试用例集成上架看护具体场景下的变量展示
  关键日志: NA
  大数据打点事件: 不涉及

 - 触发条件: 开发者在调试状态下启动应用
  故障模式: 调试状态下启动应用，在调试状态中会偶发crash
  故障影响: 应用闪退，开发者无法继续进行调试
  故障原因: 在多线程调试场景下，线程自动销毁时对应的调试资源也需要回收，调试资源回收过程存在问题
  严酷度: 一般
  恢复措施: NA
  关键日志: NA
  大数据打点事件: 不涉及

 - 触发条件: 开发者在调试状态下调试taskpool代码，业务代码存在频繁创建worker线程
  故障模式: 调试状态下调试taskpool代码，长时间频繁创建worker线程时，会发生crash
  故障影响: 应用闪退，开发者无法继续进行调试
  故障原因: 多线程调试场景下，线程销毁时，调试资源的销毁回收存在问题
  严酷度: 提示
  恢复措施: 场景比较特殊，发生概率较小
  关键日志: NA
  大数据打点事件: 不涉及

 - 触发条件: OOM时生成rawheap文件
  故障模式: 生成rawheap文件过小无法解析
  故障影响: 本次OOM原因无法定位，需要重新触发
  故障原因: 1）dump耗时4~6秒，用户体验目标应用卡顿，用户直接划掉页面进程主动退出（80%）；2）目标应用进程被元能力DFXProcessDump接口（dump目标应用线程的寄存器信息）kill（10%）；3）应用进程内存占用超4G，整机查杀kill进程（10%）
  严酷度: 一般
  恢复措施: NA
  关键日志: NA
  大数据打点事件: 不涉及

 - 触发条件: 用户使用hidumper命令触发内存快照采样
  故障模式: memory_leak目录下无hidumper生成的快照文件
  故障影响: hidumper命令触发内存快照采样后用户无法拿到采样结果
  故障原因: 1）DFX搬移异常，未触发搬移操作；2）hidumper失败，子线程过多ArkTS总内存过大可能存在dump失败；3）extention进程无法fork采样进程，hidumper失败
  严酷度: 一般
  恢复措施: 1）若手机中没有hisysevent.def文件则不会搬移；2）NA；3）已修改，在开发者模式打开前提下，将fork进程数限制1放宽到3，可以hidumper
  关键日志: NA
  大数据打点事件: 不涉及

 - 触发条件: 用户在IDE中查看ArkTs Allocation泳道右侧AssignStack信息
  故障模式: IDE中ArkTs Allocation泳道右侧AssignStack不显示信息
  故障影响: 用户不能点击AssignStack中的行号信息直接跳转
  故障原因: NA
  严酷度: 提示
  恢复措施: NA
  关键日志: NA
  大数据打点事件: 不涉及

 - 触发条件: 开发者使用release构建工程进行调试/调优
  故障模式: release构建工程获取到的行号有误
  故障影响: release构建工程用调优工具无法获取准确行号
  故障原因: 前端编译在release模式下会对字节码进行优化，没办法保证函数内第一个字节码的行号就是函数的第一行
  严酷度: 提示
  恢复措施: 前端编译规格导致，用户使用debug模式无此问题
  关键日志: NA
  大数据打点事件: 不涉及

 - 触发条件: 用户在ArkTS Callstack泳道框选详情查看函数调用时间
  故障模式: ArkTS Callstack泳道，框选详情显示负数
  故障影响: 有极低概率（低于1%）出现函数调用时间为负数
